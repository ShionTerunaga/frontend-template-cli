pre-commit:
    commands:
        lint:
            priority: 1
            run: pnpm lint:fix
            stage_fixed: true
        format:
            priority: 2
            run: pnpm format
            stage_fixed: true

commit-msg:
    commands:
        commitlint:
            run: pnpm exec commitlint --edit {1}

post-merge:
    commands:
        install:
            run: pnpm install
